[project]
name = "surat-tugas-backend"
version = "1.0.0"
description = "Sistem Otomatisasi Surat Tugas Komdigi"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "sqlalchemy>=2.0.28",
    "alembic>=1.13.1",
    "pymysql>=1.1.0",
    "cryptography>=42.0.0",
    "pydantic>=2.6.4",
    "pydantic-settings>=2.2.1",
    "python-dotenv>=1.0.1",
    "python-multipart>=0.0.9",
    "docxtpl>=0.16.8",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.2",
    "pandas>=2.2.0",
    "gspread>=6.0.2",
    "google-auth>=2.28.1",
    "google-genai>=0.1.1",
    "pytz>=2024.1",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.0.0,<4.1.0",
    "python-jose[cryptography]>=3.3.0"
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["B008"]
